<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1f3d"/><stop offset="1" stop-color="#070d1e"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7cc0ff"/>
    </marker>
    <style>
      .lane{fill:rgba(124,192,255,.05);stroke:rgba(124,192,255,.28);stroke-width:1.2}
      .lt{fill:#7cc0ff;font-size:15px;font-weight:700;letter-spacing:2px}
      .ls{fill:#9fb3cf;font-size:14px}
      .box{fill:#13284d;stroke:#3d6aa3;stroke-width:1.4}
      .key{fill:#1b3a68;stroke:#7cc0ff;stroke-width:1.8}
      .bt{fill:#ffffff;font-size:17px;font-weight:650}
      .bs{fill:#c9d6ea;font-size:13.5px}
      .ln{stroke:#7cc0ff;stroke-width:2;fill:none;marker-end:url(#ar)}
      .dash{stroke:#7cc0ff;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#ar)}
      .tm{fill:#ffd27a;font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="860" fill="url(#bg)"/>
  <text x="50" y="58" fill="#fff" font-size="26" font-weight="700">Automated ToO follow-up on RASA36</text>
  <text x="50" y="86" class="ls">From an alert to transient candidates, with no human in the loop</text>

  <!-- lane 1: alert handling -->
  <rect class="lane" x="40" y="112" width="1120" height="190" rx="14"/>
  <text class="lt" x="62" y="140">1 · ALERT HANDLING</text>
  <rect class="box" x="62" y="160" width="300" height="118" rx="10"/>
  <text class="bt" x="82" y="194">Alerts via GCN</text>
  <text class="bs" x="82" y="220">GW (LVK) · Fermi · Swift</text>
  <text class="bs" x="82" y="242">EP · SVOM · IceCube · and more</text>
  <rect class="box" x="450" y="160" width="300" height="118" rx="10"/>
  <text class="bt" x="470" y="194">Parse and plan</text>
  <text class="bs" x="470" y="220">GCN bot · GeckoDigestor (GW maps)</text>
  <text class="bs" x="470" y="242">observability · tiles to cover the error</text>
  <rect class="box" x="838" y="160" width="300" height="118" rx="10"/>
  <text class="bt" x="858" y="194">ToO request</text>
  <text class="bs" x="858" y="220">automatic, or after manual review</text>
  <text class="bs" x="858" y="242">sent to RASA36 and 7DT</text>
  <path class="ln" d="M362 219H446"/>
  <path class="ln" d="M750 219H834"/>

  <!-- lane 2: robotic observation -->
  <rect class="lane" x="40" y="330" width="1120" height="190" rx="14"/>
  <text class="lt" x="62" y="358">2 · ROBOTIC OBSERVATION · TCSpy</text>
  <rect class="box" x="838" y="378" width="300" height="118" rx="10"/>
  <text class="bt" x="858" y="412">ToO detection</text>
  <text class="bs" x="858" y="438">Gmail API + Cloud Pub/Sub</text>
  <text class="bs" x="858" y="460">median 1.4 s</text>
  <rect class="box" x="450" y="378" width="300" height="118" rx="10"/>
  <text class="bt" x="470" y="412">Observability check</text>
  <text class="bs" x="470" y="438">weather and safety</text>
  <text class="bs" x="470" y="460">altitude · Sun · Moon</text>
  <rect class="key" x="62" y="378" width="300" height="118" rx="10"/>
  <text class="bt" x="82" y="412">RASA36 observes</text>
  <text class="bs" x="82" y="438">2.67° × 2.67° tiles, r band</text>
  <text class="tm" x="82" y="466">within 30 s of the alert</text>
  <path class="ln" d="M988 278V374"/>
  <path class="ln" d="M838 437H754"/>
  <path class="ln" d="M450 437H366"/>

  <!-- lane 3: transient search -->
  <rect class="lane" x="40" y="548" width="1120" height="190" rx="14"/>
  <text class="lt" x="1138" y="576" text-anchor="end">3 · REDUCTION AND TRANSIENT SEARCH · gpPy</text>
  <rect class="box" x="62" y="596" width="240" height="118" rx="10"/>
  <text class="bt" x="82" y="630">Data transfer</text>
  <text class="bs" x="82" y="656">Chile → Korea</text>
  <text class="bs" x="82" y="678">starts the pipeline</text>
  <rect class="box" x="342" y="596" width="240" height="118" rx="10"/>
  <text class="bt" x="362" y="630">Reduction</text>
  <text class="bs" x="362" y="656">calibration · astrometry</text>
  <text class="bs" x="362" y="678">photometry · coadd</text>
  <rect class="box" x="622" y="596" width="240" height="118" rx="10"/>
  <text class="bt" x="642" y="630">Subtraction</text>
  <text class="bs" x="642" y="656">prepared references:</text>
  <text class="bs" x="642" y="678">RASA36 · DESI · SkyMapper</text>
  <rect class="key" x="902" y="596" width="236" height="118" rx="10"/>
  <text class="bt" x="922" y="630">Candidates</text>
  <text class="bs" x="922" y="656">vetted, with a reason</text>
  <text class="tm" x="922" y="684">~40 min end to end</text>
  <path class="ln" d="M212 496V592"/>
  <path class="ln" d="M302 655H338"/>
  <path class="ln" d="M582 655H618"/>
  <path class="ln" d="M862 655H898"/>

  <!-- Slack -->
  <rect x="40" y="766" width="1120" height="58" rx="12" fill="rgba(185,140,255,.1)" stroke="rgba(185,140,255,.45)"/>
  <text x="600" y="801" text-anchor="middle" fill="#e6dcff" font-size="15.5" font-weight="600">Every step reports its status to Slack, so a failure is caught quickly</text>
</svg>
